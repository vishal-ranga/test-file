---
- name: Upload new code and Restart the service
  hosts: 192.168.1.114
  become: true

  vars:
    app: httpd

  tasks:

    - name: Place custom HTML file
      copy:
        src: index.html
        dest: /var/www/html/index.html
        mode: '0644'

    - name: Restart httpd service
      service:
        name: "{{ app }}"
        state: restarted
        enabled: yes